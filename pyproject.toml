[project]
name = "understudy"
version = "0.1.0"
description = "Record a business process on macOS and interpret it into an agent-executable procedure"
requires-python = ">=3.11"
dependencies = [
    "pyobjc-framework-Quartz>=10.3",
    "pyobjc-framework-ApplicationServices>=10.3",
    "pyobjc-framework-Cocoa>=10.3",
    "mss>=9.0",
    "pillow>=10.4",
    "anthropic>=0.40",
    "pydantic>=2.9",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
understudy = "understudy.cli:app"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/understudy"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
